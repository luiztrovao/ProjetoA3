# Banco em memória com compatibilidade PostgreSQL. Os dados somem ao reiniciar.
spring.datasource.url=jdbc:h2:mem:lanchonete;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console (JDBC URL acima, usuário "sa", sem senha)
spring.h2.console.enabled=true

# Segredo de desenvolvimento: serve só para rodar localmente. Em produção use a variável JWT_SECRET.
app.jwt.segredo=${JWT_SECRET:segredo-local-de-desenvolvimento-nao-usar-em-producao}

# Dados de demonstração do protótipo (funcionários, clientes e produtos), criados ao subir a API.
# Usuários: matheus (Dono), carlos (Gerente) e fernanda (Vendedor), todos com a senha abaixo.
app.dados-demo.habilitado=true
app.dados-demo.senha=demo123
