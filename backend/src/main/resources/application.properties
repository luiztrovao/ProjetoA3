spring.application.name=lanchonete-api
server.port=${PORT:8080}

# Perfil padrão: banco H2 em memória (roda sem instalar nada).
# Para usar o PostgreSQL (Neon), ative o perfil "prod".
spring.profiles.default=h2

# O Flyway cria as tabelas; o Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
