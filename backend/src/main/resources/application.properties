spring.application.name=lanchonete-api
server.port=${PORT:8080}

# Perfil padrão: banco H2 em memória (roda sem instalar nada).
# Para usar o PostgreSQL (Neon), ative o perfil "prod".
spring.profiles.default=h2

# O Flyway cria as tabelas; o Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Login (JWT). O segredo assina os tokens: mínimo de 32 caracteres, nunca versionado para produção.
app.jwt.segredo=${JWT_SECRET:}
app.jwt.validade=8h

# Endereços do frontend que podem chamar a API (separados por vírgula)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Primeiro usuário Dono, criado só se o banco não tiver nenhum usuário
app.admin.username=${ADMIN_USERNAME:}
app.admin.senha=${ADMIN_SENHA:}
