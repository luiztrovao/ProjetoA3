name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes, cobertura e análise estática (PMD, CPD, SpotBugs)
        run: ./mvnw -B verify
      - name: Publica relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Publica relatórios dos testes e da análise estática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: |
            backend/target/surefire-reports/
            backend/target/pmd.xml
            backend/target/cpd.xml
            backend/target/spotbugsXml.xml
            backend/target/reports/
          if-no-files-found: ignore

  backend-postgres:
    name: Backend (testes no PostgreSQL)
    # Mesma suíte do job Backend, mas no PostgreSQL 17 (o banco de produção), em vez do H2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lanchonete
          POSTGRES_USER: lanchonete
          POSTGRES_PASSWORD: lanchonete
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanchonete"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/lanchonete
      DB_USERNAME: lanchonete
      DB_PASSWORD: lanchonete
      JWT_SECRET: segredo-dos-testes-no-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes no PostgreSQL
        run: ./mvnw -B test
      - name: Publica o relatório dos testes no PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend-postgres
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instala dependências
        run: npm install --no-audit --no-fund
      - name: Verifica tipos (TypeScript)
        run: npm run typecheck
      - name: Análise estática (ESLint)
        # Reprova o build com qualquer problema novo (desde 03/11/2026, depois das correções)
        run: npm run lint
      - name: Gera relatório do ESLint
        if: always()
        run: npm run lint:relatorio || true
      - name: Publica relatório do ESLint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-eslint
          path: frontend/eslint-report.json
          if-no-files-found: ignore
      - name: Testes unitários e de componente (Vitest) com cobertura
        run: npm run test:cobertura
      - name: Publica a cobertura do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Publica o build do frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  e2e:
    name: Testes de sistema (Playwright)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gera o jar da API
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Instala dependências e o navegador
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testes de sistema e aceitação
        working-directory: frontend
        run: npm run test:e2e
      - name: Publica o relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud (backend)
    runs-on: ubuntu-latest
    # Só roda depois que o segredo SONAR_TOKEN for criado no repositório (veja docs/analise-estatica.md)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Análise no SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=luiztrovao
          -Dsonar.projectKey=luiztrovao_ProjetoA3
      - name: SonarCloud não configurado
        if: env.SONAR_TOKEN == ''
        working-directory: .
        run: echo "Segredo SONAR_TOKEN ausente; análise no SonarCloud ignorada."

  docker:
    name: Imagem Docker da API (Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t ponto-e-sabor-api backend
